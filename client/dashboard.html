    async function deleteTask(taskId) {
      const messageEl = document.getElementById('message');

      try {
        const res = await fetch(API_URL + '/api/tasks/' + taskId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401) {
          messageEl.style.color = 'red';
          messageEl.textContent = 'Session expired, please login again.';
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        if (res.status === 403) {
          messageEl.style.color = 'orange';
          messageEl.textContent = "You don't have permission to delete this task.";
          return;
        }

        if (res.ok) {
          messageEl.style.color = 'green';
          messageEl.textContent = 'Task deleted successfully!';
          loadTasks();
        }

      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Could not connect to server';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userName');
      window.location.href = 'login.html';
    }

    loadTasks();
