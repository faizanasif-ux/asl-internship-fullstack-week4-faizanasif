<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 8px 15px;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .add-task-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 95%;
      padding: 10px;
      margin: 5px 0;
      box-sizing: border-box;
    }
    .add-btn {
      background-color: #4CAF50;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .controls-box {
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls-box input,
    .controls-box select {
      width: auto;
      flex: 1;
      min-width: 140px;
      margin: 0;
    }
    .apply-btn {
      background-color: #f44336;
      padding: 10px 20px;
      white-space: nowrap;
    }
    .task {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .task-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .task a {
      color: #2196F3;
      text-decoration: none;
    }
    .delete-btn {
      background-color: #f44336;
      padding: 5px 10px;
    }
    #message {
      text-align: center;
      margin: 10px 0;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }
    .pagination button {
      background-color: #ccc;
      color: #333;
      padding: 8px 15px;
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="welcomeText">Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <p id="message"></p>

  <div class="add-task-box">
    <input type="text" id="title" placeholder="Task title">
    <input type="text" id="description" placeholder="Description (optional)">
    <input type="file" id="attachment">
    <button class="add-btn" onclick="createTask()">Add Task</button>
  </div>

  <div class="controls-box">
    <input type="text" id="searchInput" placeholder="Search by title...">
    <select id="filterSelect">
      <option value="">All Tasks</option>
      <option value="true">Completed</option>
      <option value="false">Pending</option>
    </select>
    <select id="sortSelect">
      <option value="createdAt-desc">Newest first</option>
      <option value="createdAt-asc">Oldest first</option>
      <option value="title-asc">Title A-Z</option>
      <option value="title-desc">Title Z-A</option>
    </select>
    <button class="apply-btn" onclick="applyFilters()">Apply</button>
  </div>

  <div id="tasksList"></div>

  <div class="pagination">
    <button id="prevBtn" onclick="goToPage(currentPage - 1)">Previous</button>
    <span id="pageInfo">Page 1 of 1</span>
    <button id="nextBtn" onclick="goToPage(currentPage + 1)">Next</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) {
      window.location.href = 'login.html';
    }

    document.getElementById('welcomeText').textContent = 'Welcome, ' + userName;

    let currentPage = 1;
    const limit = 5;

    async function loadTasks() {
      const messageEl = document.getElementById('message');

      const search = document.getElementById('searchInput').value.trim();
      const completed = document.getElementById('filterSelect').value;
      const [sortBy, order] = document.getElementById('sortSelect').value.split('-');

      const params = new URLSearchParams();
      params.set('page', currentPage);
      params.set('limit', limit);
      if (search) params.set('search', search);
      if (completed) params.set('completed', completed);
      params.set('sortBy', sortBy);
      params.set('order', order);

      try {
        const res = await fetch('http://localhost:5000/api/tasks?' + params.toString(), {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401) {
          messageEl.style.color = 'red';
          messageEl.textContent = 'Session expired, please login again.';
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        const data = await res.json();
        displayTasks(data.tasks);
        updatePagination(data.currentPage, data.totalPages, data.totalTasks);

      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Could not connect to server';
      }
    }

    function displayTasks(tasks) {
      const tasksList = document.getElementById('tasksList');
      tasksList.innerHTML = '';

      if (tasks.length === 0) {
        tasksList.innerHTML = '<p style="text-align:center;">No tasks found.</p>';
        return;
      }

      tasks.forEach(task => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'task';

        const thumbHtml = task.thumbnail
          ? `<img class="task-thumb" src="http://localhost:5000${task.thumbnail}" alt="thumbnail">`
          : '';

        const attachmentLink = task.attachment
          ? `<br><a href="http://localhost:5000${task.attachment}" target="_blank">View Attachment</a>`
          : '';

        taskDiv.innerHTML = `
          <div class="task-info">
            ${thumbHtml}
            <div>
              <strong>${task.title}</strong><br>
              <small>${task.description || ''}</small>
              ${attachmentLink}
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
        `;
        tasksList.appendChild(taskDiv);
      });
    }

    function updatePagination(page, totalPages, totalTasks) {
      currentPage = page;
      document.getElementById('pageInfo').textContent =
        `Page ${page} of ${totalPages || 1} (${totalTasks} tasks)`;
      document.getElementById('prevBtn').disabled = page <= 1;
      document.getElementById('nextBtn').disabled = page >= totalPages;
    }

    function goToPage(page) {
      if (page < 1) return;
      currentPage = page;
      loadTasks();
    }

    function applyFilters() {
      currentPage = 1;
      loadTasks();
    }

    async function createTask() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const attachmentInput = document.getElementById('attachment');
      const messageEl = document.getElementById('message');

      if (!title) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Title is required';
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      if (attachmentInput.files[0]) {
        formData.append('attachment', attachmentInput.files[0]);
      }

      try {
        const res = await fetch('http://localhost:5000/api/tasks', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: formData
        });

        if (res.status === 401) {
          messageEl.style.color = 'red';
          messageEl.textContent = 'Session expired, please login again.';
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        if (res.ok) {
          document.getElementById('title').value = '';
          document.getElementById('description').value = '';
          attachmentInput.value = '';
          messageEl.style.color = 'green';
          messageEl.textContent = 'Task added successfully!';
          loadTasks();
        } else {
          const data = await res.json();
          messageEl.style.color = 'red';
          messageEl.textContent = data.message;
        }

      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Could not connect to server';
      }
    }

    async function deleteTask(taskId) {
      const messageEl = document.getElementById('message');

      try {
        const res = await fetch('http://localhost:5000/api/tasks/' + taskId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401) {
          messageEl.style.color = 'red';
          messageEl.textContent = 'Session expired, please login again.';
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        if (res.status === 403) {
          messageEl.style.color = 'orange';
          messageEl.textContent = "You don't have permission to delete this task.";
          return;
        }

        if (res.ok) {
          messageEl.style.color = 'green';
          messageEl.textContent = 'Task deleted successfully!';
          loadTasks();
        }

      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Could not connect to server';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userName');
      window.location.href = 'login.html';
    }

    loadTasks();
  </script>

</body>
</html>
